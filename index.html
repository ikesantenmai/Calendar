<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カレンダー</title>
<meta name="description" content="予定を入力・管理できるカレンダー。iPhone のカレンダー（.ics）のインポートと月間カレンダーの印刷に対応。日本語 / English.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1f24" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="カレンダー">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">
  <header class="toolbar no-print">
    <div class="toolbar__group">
      <div class="navcluster">
        <button id="prevBtn" class="iconbtn" data-i18n-title="nav.prevTitle" data-i18n-aria="nav.prev">‹</button>
        <button id="todayBtn" class="btn" data-i18n-title="nav.nextTitle" data-i18n="nav.today">今日</button>
        <button id="nextBtn" class="iconbtn" data-i18n-title="nav.next" data-i18n-aria="nav.next">›</button>
      </div>
      <h1 id="title" class="title">&nbsp;</h1>
      <input type="month" id="monthPicker" class="monthpicker" data-i18n-aria="nav.month">
    </div>

    <div class="toolbar__group toolbar__group--end">
      <button id="addBtn" class="btn btn--primary" data-i18n-title="btn.addTitle">
        <span data-i18n="btn.add">＋</span><span class="btn__label" data-i18n="btn.addLabel"> 予定を追加</span>
      </button>
      <!-- 画面が狭いときは、以下のボタンを「⋯」メニューにまとめる -->
      <div class="menu" id="menu">
        <button id="langBtn" class="btn btn--lang" title="日本語 / English">English</button>
        <button id="importBtn" class="btn" data-i18n="btn.import">インポート</button>
        <button id="exportBtn" class="btn" data-i18n="btn.export">書き出し</button>
        <button id="calsBtn" class="btn" data-i18n="btn.calendars">カレンダー</button>
        <button id="printBtn" class="btn" data-i18n-title="btn.printTitle" data-i18n="btn.print">印刷</button>
      </div>
      <button id="menuBtn" class="btn btn--menu" aria-haspopup="true" aria-expanded="false"
              aria-controls="menu" data-i18n-aria="btn.menu">⋯</button>
    </div>
  </header>

  <!-- 印刷時のみ表示されるヘッダー -->
  <div class="printhead" aria-hidden="true">
    <div class="printhead__title" id="printTitle"></div>
    <div class="printhead__meta" id="printMeta"></div>
  </div>

  <main class="layout">
    <section class="calendar" data-i18n-aria="app.name">
      <div class="weekdays" id="weekdays"></div>
      <div class="grid" id="grid"></div>
    </section>

    <aside class="sidebar no-print" id="sidebar">
      <div class="sidebar__head">
        <h2 id="sidebarDate">—</h2>
        <button id="sidebarAdd" class="btn btn--small btn--primary" data-i18n="side.addToDay">＋ この日に追加</button>
      </div>
      <div id="sidebarHoliday" class="sidebar__holiday" hidden></div>
      <ul id="sidebarList" class="daylist"></ul>
      <p id="sidebarEmpty" class="muted" data-i18n="side.empty">予定はありません。</p>

      <div class="sidebar__cals">
        <h3 data-i18n="side.calendars">カレンダー</h3>
        <ul id="calLegend" class="callegend"></ul>
      </div>
    </aside>
  </main>

  <footer class="statusbar no-print">
    <span id="status" class="muted"></span>
    <span class="muted" data-i18n="status.storage">データはこのブラウザ内（localStorage）に保存されます</span>
  </footer>
</div>

<!-- ========== 予定ダイアログ ========== -->
<dialog id="eventDialog" class="dialog">
  <form method="dialog" id="eventForm" class="dialog__body">
    <header class="dialog__head">
      <h2 id="eventDialogTitle">予定を追加</h2>
      <button type="button" class="iconbtn" data-close data-i18n-aria="btn.close">✕</button>
    </header>

    <div class="field">
      <label for="evTitle" data-i18n="ev.title">タイトル</label>
      <input id="evTitle" name="title" type="text" required maxlength="200"
             data-i18n-placeholder="ev.titlePh" autocomplete="off">
    </div>

    <div class="field field--row">
      <label class="check"><input type="checkbox" id="evAllDay"> <span data-i18n="ev.allDay">終日</span></label>
      <label class="check"><input type="checkbox" id="evRepeatToggle"> <span data-i18n="ev.repeat">繰り返し</span></label>
    </div>

    <div class="grid2">
      <div class="field">
        <label for="evStartDate" data-i18n="ev.start">開始</label>
        <div class="inline">
          <input id="evStartDate" type="date" required>
          <input id="evStartTime" type="time" step="300">
        </div>
      </div>
      <div class="field">
        <label for="evEndDate" data-i18n="ev.end">終了</label>
        <div class="inline">
          <input id="evEndDate" type="date" required>
          <input id="evEndTime" type="time" step="300">
        </div>
      </div>
    </div>

    <div class="field" id="evRepeatRow" hidden>
      <label for="evRepeat" data-i18n="ev.repeatSet">繰り返し設定</label>
      <div class="inline">
        <select id="evRepeat">
          <option value="" data-i18n="rep.none">なし</option>
          <option value="FREQ=DAILY" data-i18n="rep.daily">毎日</option>
          <option value="FREQ=WEEKLY" data-i18n="rep.weekly">毎週</option>
          <option value="FREQ=WEEKLY;INTERVAL=2" data-i18n="rep.biweekly">隔週</option>
          <option value="FREQ=MONTHLY" data-i18n="rep.monthlyDate">毎月（同じ日）</option>
          <option value="FREQ=MONTHLY;BYDAY=" data-i18n="rep.monthlyDay">毎月（同じ曜日）</option>
          <option value="FREQ=YEARLY" data-i18n="rep.yearly">毎年</option>
        </select>
        <label class="inline inline--tight"><span data-i18n="ev.until">終了日</span>
          <input id="evRepeatUntil" type="date">
        </label>
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label for="evCalendar" data-i18n="ev.calendar">カレンダー</label>
        <select id="evCalendar"></select>
      </div>
      <div class="field">
        <label for="evColor" data-i18n="ev.color">色</label>
        <div class="swatches" id="evColor"></div>
      </div>
    </div>

    <div class="field">
      <label for="evLocation" data-i18n="ev.location">場所</label>
      <input id="evLocation" type="text" maxlength="200" autocomplete="off">
    </div>

    <div class="field">
      <label for="evNotes" data-i18n="ev.notes">メモ</label>
      <textarea id="evNotes" rows="3" maxlength="2000"></textarea>
    </div>

    <p class="error" id="evError" hidden></p>

    <footer class="dialog__foot">
      <button type="button" id="evDelete" class="btn btn--danger" data-i18n="ev.delete" hidden>削除</button>
      <span class="spacer"></span>
      <button type="button" class="btn" data-close data-i18n="ev.cancel">キャンセル</button>
      <button type="submit" class="btn btn--primary" data-i18n="ev.save">保存</button>
    </footer>
  </form>
</dialog>

<!-- ========== インポートダイアログ ========== -->
<dialog id="importDialog" class="dialog">
  <div class="dialog__body">
    <header class="dialog__head">
      <h2 data-i18n="imp.title">カレンダーをインポート</h2>
      <button type="button" class="iconbtn" data-close data-i18n-aria="btn.close">✕</button>
    </header>

    <div id="dropzone" class="dropzone" tabindex="0" role="button" data-i18n-aria="imp.dropLabel">
      <strong data-i18n="imp.dropStrong">.ics ファイルを選ぶ</strong>
      <span class="muted" data-i18n="imp.dropHint">タップ／クリックで選択（複数可）</span>
      <input type="file" id="fileInput" accept=".ics,.ical,.ifb,text/calendar" multiple hidden>
    </div>

    <details class="howto">
      <summary data-i18n="imp.howto">iPhone のカレンダーを書き出す方法</summary>
      <div data-i18n-html="imp.howtoBody"></div>
    </details>

    <div class="field">
      <label for="urlInput" data-i18n="imp.urlLabel">URL から読み込む</label>
      <div class="inline">
        <input id="urlInput" type="url" placeholder="webcal://p01-calendars.icloud.com/published/…">
        <button type="button" id="urlLoad" class="btn" data-i18n="imp.load">読み込む</button>
      </div>
      <p class="muted small" data-i18n="imp.corsNote"></p>
    </div>

    <div id="importPreview" hidden>
      <h3 class="subhead" data-i18n="imp.preview">読み込み内容</h3>
      <ul id="importSummary" class="summary"></ul>

      <div class="grid2">
        <div class="field">
          <label for="importName" data-i18n="imp.name">カレンダー名</label>
          <input id="importName" type="text" maxlength="80">
        </div>
        <div class="field">
          <label data-i18n="imp.color">色</label>
          <div class="swatches" id="importColor"></div>
        </div>
      </div>

      <div class="field">
        <label for="importTarget" data-i18n="imp.target">取り込み先</label>
        <select id="importTarget"></select>
      </div>

      <label class="check"><input type="checkbox" id="importDedupe" checked>
        <span data-i18n="imp.dedupe">同じ予定（UID）が既にある場合は上書きする</span></label>
    </div>

    <p class="error" id="importError" hidden></p>

    <footer class="dialog__foot">
      <span class="spacer"></span>
      <button type="button" class="btn" data-close data-i18n="btn.close">閉じる</button>
      <button type="button" id="importCommit" class="btn btn--primary" data-i18n="imp.commit" disabled>取り込む</button>
    </footer>
  </div>
</dialog>

<!-- ========== カレンダー・設定ダイアログ ========== -->
<dialog id="calsDialog" class="dialog">
  <div class="dialog__body">
    <header class="dialog__head">
      <h2 data-i18n="cal.title">カレンダー</h2>
      <button type="button" class="iconbtn" data-close data-i18n-aria="btn.close">✕</button>
    </header>
    <ul id="calsList" class="cals"></ul>
    <div class="inline">
      <input id="newCalName" type="text" data-i18n-placeholder="cal.newName" maxlength="80">
      <button type="button" id="newCalAdd" class="btn" data-i18n="cal.add">追加</button>
    </div>
    <hr>
    <div class="field">
      <label for="langSelect" data-i18n="cal.lang">言語 / Language</label>
      <select id="langSelect">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </div>
    <label class="check"><input type="checkbox" id="optHolidays" checked>
      <span data-i18n="cal.optHolidays">日本の祝日を表示する</span></label>
    <label class="check"><input type="checkbox" id="optWeekStart">
      <span data-i18n="cal.optWeekStart">週の開始を月曜にする</span></label>
    <hr>
    <div class="inline">
      <button type="button" id="wipeBtn" class="btn btn--danger" data-i18n="cal.wipe">すべてのデータを削除</button>
    </div>
    <footer class="dialog__foot">
      <span class="spacer"></span>
      <button type="button" class="btn btn--primary" data-close data-i18n="btn.close">閉じる</button>
    </footer>
  </div>
</dialog>

<!-- ========== 印刷ダイアログ ========== -->
<dialog id="printDialog" class="dialog">
  <div class="dialog__body">
    <header class="dialog__head">
      <h2 data-i18n="prt.title">印刷</h2>
      <button type="button" class="iconbtn" data-close data-i18n-aria="btn.close">✕</button>
    </header>
    <p class="muted" id="printDesc"></p>

    <div class="field">
      <label data-i18n="prt.orient">用紙の向き</label>
      <div class="segmented" id="printOrient">
        <label><input type="radio" name="orient" value="landscape" checked>
          <span data-i18n="prt.landscape">横</span></label>
        <label><input type="radio" name="orient" value="portrait">
          <span data-i18n="prt.portrait">縦</span></label>
      </div>
    </div>

    <label class="check"><input type="checkbox" id="printTimes" checked>
      <span data-i18n="prt.times">開始時刻を表示する</span></label>
    <label class="check"><input type="checkbox" id="printLocation">
      <span data-i18n="prt.loc">場所を表示する</span></label>
    <label class="check"><input type="checkbox" id="printColors" checked>
      <span data-i18n="prt.colors">予定の色を印刷する</span></label>
    <label class="check"><input type="checkbox" id="printMono">
      <span data-i18n="prt.mono">白黒（枠線のみ）で印刷する</span></label>

    <p class="muted small" data-i18n="prt.note"></p>

    <footer class="dialog__foot">
      <span class="spacer"></span>
      <button type="button" class="btn" data-close data-i18n="prt.cancel">キャンセル</button>
      <button type="button" id="printGo" class="btn btn--primary" data-i18n="prt.go">印刷する</button>
    </footer>
  </div>
</dialog>

<script src="js/i18n.js"></script>
<script src="js/holidays.js"></script>
<script src="js/ics.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
